name: Build Timer.exe

on:
  push:
    branches: [timer]
    paths-ignore: ["release/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --clean --name Timer timer_overlay.py
      - uses: actions/upload-artifact@v4
        with:
          name: Timer-exe
          path: dist/Timer.exe
      - name: Commit exe to branch
        shell: bash
        run: |
          mkdir -p release
          cp dist/Timer.exe release/Timer.exe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/Timer.exe
          git commit -m "Add built Timer.exe [skip ci]" || echo "no change"
          git push
