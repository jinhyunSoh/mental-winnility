name: Build Timer.exe

on:
  push:
    branches: [timer]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller
      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --clean --name Timer timer_overlay.py
      - uses: actions/upload-artifact@v4
        with:
          name: Timer-exe
          path: dist/Timer.exe
