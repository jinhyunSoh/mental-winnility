<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 멘탈 위닝리티</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="stylesheet" href="css/style.css">
<style>
  .nf{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;background:var(--navy);color:#fff;padding:40px 24px;
    position:relative;overflow:hidden;
  }
  .nf-code{font-size:clamp(64px,14vw,120px);font-weight:900;color:var(--accent);line-height:1;letter-spacing:-0.04em;}
  .nf h1{margin-top:18px;font-size:clamp(20px,3.4vw,26px);font-weight:800;letter-spacing:-0.02em;}
  .nf p{margin-top:14px;color:rgba(255,255,255,0.6);font-size:15px;}
  .nf .btn{margin-top:32px;}
</style>
</head>
<body>
  <main class="nf">
    <div class="hero-glow" aria-hidden="true"></div>
    <div style="position:relative;z-index:1">
      <div class="nf-code">404</div>
      <h1>페이지를 찾을 수 없습니다</h1>
      <p>주소가 변경되었거나 삭제된 페이지일 수 있습니다.</p>
      <a href="/" class="btn btn-primary btn-lg">홈으로 돌아가기</a>
    </div>
  </main>
</body>
</html>
